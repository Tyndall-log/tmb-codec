name: build-and-publish

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: clang-cl
          - os: macos-14
            compiler: clang++
          - os: macos-15-intel
            compiler: clang++
          - os: ubuntu-latest
            compiler: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify Clang
        run: ${{ matrix.compiler }} --version
      - name: Configure
        run: >-
          cmake -S . -B build-native -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DTMB_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-native --parallel
      - name: Test
        run: ctest --test-dir build-native --output-on-failure
      - name: Install native SDK
        run: cmake --install build-native --prefix stage
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: stage

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: clang-cl
            build: cp313-win_amd64
            before-all: ""
          - os: macos-14
            compiler: clang++
            build: cp313-macosx_arm64
            before-all: ""
          - os: macos-15-intel
            compiler: clang++
            build: cp313-macosx_x86_64
            before-all: ""
          - os: ubuntu-latest
            compiler: clang++
            build: cp313-manylinux_x86_64
            before-all: dnf install -y clang ninja-build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify Clang
        if: runner.os != 'Linux'
        run: ${{ matrix.compiler }} --version
      - name: Build and test wheel with Clang
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_BEFORE_ALL: ${{ matrix.before-all }}
          CIBW_ENVIRONMENT: >-
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DTMB_BUILD_TESTS=OFF"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests/python -q
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -G Ninja -DTMB_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-wasm --parallel
      - name: Test
        run: node tests/wasm_smoke.mjs build-wasm/tmb_codec.js
      - name: Stage
        run: |
          mkdir -p stage/include stage/licenses
          cp build-wasm/tmb_codec.js build-wasm/tmb_codec.wasm stage/
          cp include/tmb_codec.h stage/include/
          cp licenses/CORTO_LICENSE.txt stage/licenses/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md stage/
      - uses: actions/upload-artifact@v5
        with:
          name: wasm-wasm32
          path: stage

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DTMB_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test malformed inputs under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sanitizers]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tmb-codec/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, wheels, wasm, sanitizers, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: native-artifacts
      - uses: actions/download-artifact@v5
        with:
          name: wasm-wasm32
          path: wasm-wasm32
      - name: Package native SDKs and WASM
        run: |
          for directory in native-artifacts/native-*; do
            platform="${directory#native-artifacts/native-}"
            (cd "$directory" && zip -r "../../tmb-codec-${platform}.zip" .)
          done
          (cd wasm-wasm32 && zip -r ../tmb-codec-WASM-wasm32.zip .)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          tmb-codec-*.zip
          --verify-tag --generate-notes
