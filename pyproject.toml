[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "tmb-codec"
version = "0.2.0"
description = "Fast Triangle Mesh Binary encoding and decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/CORTO_LICENSE.txt"]
authors = [{ name = "Tyndall-log" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.26",
    "zstandard>=0.23",
]

[project.urls]
Documentation = "https://github.com/Tyndall-log/tmb-codec#readme"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/tmb_codec"]
wheel.py-api = "py3"
sdist.exclude = [".github", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
